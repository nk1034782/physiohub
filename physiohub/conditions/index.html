<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Conditions Library — PHYSIOHUB</title>
  <link rel="stylesheet" href="/physiohub/assets/css/physiohub.css">
</head>
<body>
  <header class="ph-subheader"><div class="wrap"><a class="back" href="/physiohub/">← PHYSIOHUB</a></div></header>
  <main class="wrap">
    <h2>Conditions Library</h2>
    <div class="controls">
      <input id="condSearch" placeholder="Search conditions (e.g. stroke)" />
      <select id="condFilter">
        <option value="">All categories</option>
        <option>Neurological</option>
        <option>Orthopaedic</option>
        <option>Cardiopulmonary</option>
        <option>Paediatric</option>
        <option>Geriatric</option>
        <option>Sports</option>
      </select>
    </div>

    <div id="conditionsList" class="grid-cards">
      <!-- JS will render sample condition cards -->
    </div>
  </main>

  <script src="/physiohub/assets/js/physiohub.js"></script>
</body>
</html>
