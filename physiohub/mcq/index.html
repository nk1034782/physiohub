<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MCQ — PHYSIOHUB</title>
  <link rel="stylesheet" href="/physiohub/assets/css/physiohub.css">
</head>
<body>
  <header class="ph-subheader"><div class="wrap"><a class="back" href="/physiohub/">← PHYSIOHUB</a></div></header>
  <main class="wrap">
    <h2>MCQ Practice</h2>
    <div id="mcqApp">
      <div id="mcqQuestion"></div>
      <div id="mcqOptions"></div>
      <div class="mcq-controls">
        <button id="mcqPrev" class="btn">Previous</button>
        <button id="mcqNext" class="btn">Next</button>
        <button id="mcqSubmit" class="btn btn-primary">Submit</button>
        <button id="mcqRestart" class="btn">Restart</button>
      </div>
      <div id="mcqResult" class="mcq-result"></div>
    </div>
  </main>

  <script src="/physiohub/assets/js/physiohub.js"></script>
</body>
</html>
